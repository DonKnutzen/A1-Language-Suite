name: Prepare verified radio audio once
on:
  push:
    branches: [codex/fix-firefox-radio]
    paths: [.github/workflows/radio-publish-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Build and verify the reviewed radio release
        shell: bash
        run: |
          set -euo pipefail
          git clone --single-branch --branch codex/fix-firefox-radio https://github.com/DonKnutzen/A1-Language-Suite.git radio-release
          cd radio-release
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          npm ci
          python3 -m venv .radio-venv
          .radio-venv/bin/python -m pip install edge-tts==7.3.1
          python3 <<'PY'
          import base64, concurrent.futures, hashlib, json, os, pathlib, urllib.error, urllib.request
          expected=json.loads(pathlib.Path('.github/radio-expected-blobs.json').read_text())
          def restore(item):
              name, sha=item
              url='https://api.github.com/repos/DonKnutzen/A1-Language-Suite/git/blobs/'+sha
              req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'verified-radio-release'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      data=base64.b64decode(json.load(r)['content'])
                  actual=hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()
                  if actual!=sha: raise RuntimeError('Blob mismatch: '+name)
                  target=pathlib.Path(name); target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
                  return 1
              except urllib.error.HTTPError as e:
                  if e.code==404: return 0
                  raise
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              print('Restored exact recordings:',sum(pool.map(restore,expected.items())))
          PY
          node tools/build-radio-recordings.cjs .radio-jobs.json
          node <<'NODE'
          const fs=require('fs'),seen=new Set(),jobs=JSON.parse(fs.readFileSync('.radio-jobs.json','utf8'));
          fs.writeFileSync('.radio-jobs.json',JSON.stringify(jobs.filter(j=>{if(seen.has(j.file))return false;seen.add(j.file);return true;})));
          NODE
          .radio-venv/bin/python tools/generate-radio-recordings.py .radio-jobs.json .radio-chunks
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),expected=JSON.parse(fs.readFileSync('.github/radio-expected-blobs.json','utf8'));
          for(const [file,sha]of Object.entries(expected)){const data=fs.readFileSync(file),actual=crypto.createHash('sha1').update('blob '+data.length+'\0').update(data).digest('hex');if(actual!==sha)throw Error('Recording differs from tested bytes: '+file);}
          console.log('All 193 recordings match the exact Firefox-tested bytes.');
          NODE
          node --test tests/radio-recordings.test.cjs tests/francais-a2-mobile-audio.test.cjs tests/french-voice-fallback.test.cjs tests/game-hard-mode.test.cjs tests/guide-follow-voices.test.cjs tests/guide-speaker-labels.test.cjs tests/dialogue-routing.test.cjs tests/review-audio.test.cjs tests/whole-lesson-guide.test.cjs tests/guided-additional-courses.test.cjs francais/tests/listening-audio.test.cjs deutsch/tests/listening-audio.test.cjs
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git add shared/audio/radio shared/radio-recordings.js
          git commit -m "Add exact verified radio recordings"
          cp .git/index "$RUNNER_TEMP/radio-verified-index"
          GIT_INDEX_FILE="$RUNNER_TEMP/radio-verified-index" git update-index --force-remove .github/workflows/radio-publish-once.yml .github/radio-expected-blobs.json
          VERIFIED_TREE=$(GIT_INDEX_FILE="$RUNNER_TEMP/radio-verified-index" git write-tree)
          test "$VERIFIED_TREE" = "114495d69cc06f9a25acde427716dc8d27737021"
          gh auth setup-git --hostname github.com
          git push origin HEAD:codex/fix-firefox-radio
